<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>水滸時間軸</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 書頁式頁首＋篩選列，下方三視圖分頁；明細以右側抽屜疊上。色調取宋版書的竹紙、墨、石青石綠與朱印。 */
:root{
  --paper:#eceee8; --paper-2:#e1e5dd; --card:#f7f8f4; --ink:#1c2227; --ink-2:#55605f; --line:#c3cbc2;
  --accent:#2c5a86; --accent-soft:#d5e0ea; --seal:#a8382a;
  --g-tg:#2c5a86; --g-ds:#3f7550; --g-ot:#86683f;
  --st-none:#d5dad2; --st-wild:#c4943d; --st-liang:#2c5a86; --st-gone:#5b6164;
  --r-jie:#2c5a86; --r-zhu:#3f7550; --r-xd:#86683f; --r-fq:#a2557a; --r-ch:#a8382a;
  --shadow:0 10px 30px rgb(28 34 39 / .14);
  --f-display:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti","KaiTi",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14181b; --paper-2:#1b2125; --card:#20272b; --ink:#e3e6df; --ink-2:#a1aaa6; --line:#343d41;
  --accent:#86afd8; --accent-soft:#25384a; --seal:#e07563;
  --g-tg:#86afd8; --g-ds:#86bc95; --g-ot:#c9a97c;
  --st-none:#2b3236; --st-wild:#d6a95a; --st-liang:#86afd8; --st-gone:#8a9195;
  --r-jie:#86afd8; --r-zhu:#86bc95; --r-xd:#c9a97c; --r-fq:#d38fb0; --r-ch:#e07563;
  --shadow:0 10px 30px rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14181b; --paper-2:#1b2125; --card:#20272b; --ink:#e3e6df; --ink-2:#a1aaa6; --line:#343d41;
  --accent:#86afd8; --accent-soft:#25384a; --seal:#e07563;
  --g-tg:#86afd8; --g-ds:#86bc95; --g-ot:#c9a97c;
  --st-none:#2b3236; --st-wild:#d6a95a; --st-liang:#86afd8; --st-gone:#8a9195;
  --r-jie:#86afd8; --r-zhu:#86bc95; --r-xd:#c9a97c; --r-fq:#d38fb0; --r-ch:#e07563;
  --shadow:0 10px 30px rgb(0 0 0 / .45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}

/* masthead */
.mast{padding-block:22px 10px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.seal{width:46px;height:46px;border:2px solid var(--seal);color:var(--seal);border-radius:4px;display:grid;grid-template-columns:1fr 1fr;place-items:center;font-family:var(--f-display);font-size:17px;line-height:1;padding:3px;flex:none}
.mast h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);margin:0;letter-spacing:.06em;text-wrap:balance}
.mast p{margin:0;color:var(--ink-2);font-size:13px;letter-spacing:.04em}

/* S1 filter */
.filter{border-block:1px solid var(--line);background:var(--paper-2)}
.filter .wrap{padding-block:12px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative;flex:1 1 240px;min-width:0;max-width:360px}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.search svg{position:absolute;left:10px;top:50%;translate:0 -50%;width:16px;height:16px;stroke:var(--ink-2)}
.tog{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tog .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
.label{font-size:12px;color:var(--ink-2);letter-spacing:.08em}
.chars{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden}
.chip .pick{display:flex;align-items:center;gap:7px;border:0;background:none;padding:3px 10px 3px 3px}
.chip .nm{font-size:14px}
.chip .nk{font-size:11.5px;color:var(--ink-2)}
.chip .info{border:0;border-left:1px solid var(--line);background:none;padding:0 9px;align-self:stretch;color:var(--ink-2);font-size:12px;font-family:var(--f-display)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip.on .info{border-color:var(--accent)}
.empty-note{color:var(--ink-2);font-size:13px;padding:6px 0}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:var(--paper);flex:none;line-height:1}
.av.tg{background:var(--g-tg)} .av.ds{background:var(--g-ds)} .av.ot{background:var(--g-ot)}
.av.ring{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--seal)}
.sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.tag button{border:0;background:rgb(255 255 255 / .16);color:inherit;border-radius:50%;width:20px;height:20px;line-height:1;padding:0}
.link{border:0;background:none;color:var(--accent);padding:2px 4px;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.tabs button{border:0;background:none;padding:7px 16px;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.count{font-family:var(--f-display);font-size:18px}
.count b{font-variant-numeric:tabular-nums;color:var(--accent);font-size:22px;padding:0 3px}

/* S2 timeline */
.view{padding-block:18px 40px}
.tl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.tl{position:relative}
.arcs{position:relative;height:52px;border-bottom:1px solid var(--line)}
.arc{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding:5px 8px;text-align:left;background:none;border-top:0;border-right:0;border-bottom:0;overflow:hidden;white-space:nowrap}
.arc:nth-child(odd){background:var(--paper-2)}
.arc b{display:block;font-family:var(--f-display);font-size:14px;font-weight:400}
.arc span{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.arc:hover b{color:var(--accent);text-decoration:underline}
.ruler{position:relative;height:26px;border-bottom:1px solid var(--line)}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--ink-2);padding-left:3px;font-variant-numeric:tabular-nums}
.tick.minor{top:16px;border-color:var(--line);opacity:.6}
.lanes{position:relative}
.ev{position:absolute;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:0 9px 6px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,box-shadow .15s}
.ev:hover{border-color:var(--accent);box-shadow:var(--shadow);z-index:2}
.ev .span{height:5px;margin:0 -9px 4px;border-radius:5px 5px 0 0;background:var(--accent);opacity:.85}
.ev .span.pt{width:11px;height:11px;border-radius:50%;margin:6px 0 2px -4px}
.ev .t{font-family:var(--f-display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .m{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.avs{display:flex}
.avs .av{width:20px;height:20px;font-size:11px;margin-left:-4px;box-shadow:0 0 0 1.5px var(--card)}
.avs .av:first-child{margin-left:0}
.avs .av.ring{box-shadow:0 0 0 1.5px var(--card),0 0 0 3px var(--seal)}
.more{font-size:11px;color:var(--ink-2);margin-left:3px}
.empty{padding:48px 16px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink);margin:0 0 6px}
.vlist{display:none}
@media (max-width:720px){
  .chars{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.chip{flex:none}
  .tl-scroll{display:none}.vlist{display:grid;gap:18px}
  .vgroup h3{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .vgroup h3 button{all:unset;cursor:pointer}
  .vgroup h3 small{font-family:var(--f-ui);font-size:12px;color:var(--ink-2)}
  .vrow{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start}
  .vrow .ch{font-size:12px;color:var(--ink-2);text-align:right;padding-top:9px;font-variant-numeric:tabular-nums;border-right:2px solid var(--line);padding-right:9px;align-self:stretch}
  .vrow .ev{position:static;width:auto!important}
  .vgroup .stack{display:grid;gap:8px}
}

/* drawer S3/S4 */
.scrim{position:fixed;inset:0;background:rgb(10 14 16 / .28);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (max-width:720px){.drawer{top:auto;width:100%;height:82%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding-left:env(safe-area-inset-left,0px)}}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}
.dh .k{font-size:12px;letter-spacing:.1em;color:var(--ink-2)}
.x{border:1px solid var(--line);background:none;border-radius:6px;width:32px;height:32px;font-size:18px;line-height:1}
.db{overflow-y:auto;padding:18px;display:grid;gap:18px;align-content:start}
.db h2{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;line-height:1.2;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.meta b{color:var(--ink);font-weight:500}
.sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;color:var(--ink-2);font-weight:500}
.huimu{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-family:var(--f-display);font-size:15px}
.huimu li{display:grid;grid-template-columns:58px 1fr;gap:8px}
.huimu span{color:var(--ink-2);font-family:var(--f-ui);font-size:12px;padding-top:2px;font-variant-numeric:tabular-nums}
.people{display:grid;gap:6px}
.person{display:flex;align-items:center;gap:10px}
.person .av{width:32px;height:32px;font-size:16px;border:0;cursor:pointer}
.person .av:hover{filter:brightness(1.12)}
.person .nmb{border:0;background:none;padding:0;font-size:15px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.person small{color:var(--ink-2)}
.person .added{font-size:11px;color:var(--ink-2);margin-left:auto}
.summary{font-size:15px;line-height:1.75;margin:0;max-width:60ch}
.place{border:1px solid var(--line);background:var(--paper-2);border-radius:6px;padding:4px 10px;font-size:14px}
.pn{display:flex;gap:8px;border-top:1px solid var(--line);padding:12px 18px}
.pn button{flex:1;border:1px solid var(--line);background:var(--paper-2);border-radius:6px;padding:8px;font-size:13px;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn button:last-child{text-align:right}
.pn button:disabled{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--ink-2)}

/* S4 status bar */
.stbar{display:flex;height:16px;border-radius:3px;overflow:hidden}
.stbar i{display:block;height:100%}
.s-none{background:var(--st-none)} .s-wild{background:var(--st-wild)} .s-liang{background:var(--st-liang)} .s-gone{background:var(--st-gone)}
.stwrap{position:relative;padding-top:40px}
.stmk{position:absolute;font-size:11px;translate:-50% 0;white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums;line-height:14px}
.stln{position:absolute;top:30px;height:28px;border-left:1.5px solid var(--ink)}
.stscale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.elist{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.elist button{width:100%;display:grid;grid-template-columns:72px 1fr;gap:8px;border:0;background:none;text-align:left;padding:5px 6px;border-radius:4px}
.elist button:hover{background:var(--paper-2)}
.elist span{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:1px}
.elist b{font-family:var(--f-display);font-weight:400;font-size:15px}
.rlist{display:flex;flex-wrap:wrap;gap:6px}
.rlist button{border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:3px 10px 3px 4px;display:flex;align-items:center;gap:6px;font-size:13px}
.rlist .av{width:22px;height:22px;font-size:12px}
.rt{font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid currentColor}
.primary{border:0;background:var(--ink);color:var(--paper);border-radius:6px;padding:9px 14px;font-size:14px;justify-self:start}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--ink-2)}

/* S5 map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
@media (max-width:900px){.mapgrid{grid-template-columns:1fr}}
.mapbox{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.sea{fill:var(--accent-soft)} .land{fill:var(--paper-2)}
.river{fill:none;stroke:var(--accent);stroke-width:2;opacity:.45}
.rlabel{font-size:11px;fill:var(--accent);opacity:.8}
.marsh{fill:var(--accent);opacity:.25}
.trail{fill:none;stroke:var(--seal);stroke-width:2;stroke-dasharray:6 5}
.trailno{font-size:10px;fill:var(--paper);font-weight:700}
.mk{cursor:pointer}
.mk circle.o{fill:var(--accent);stroke:var(--card);stroke-width:2}
.mk.hi circle.o{fill:var(--seal)}
.mk text.n{fill:var(--paper);font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.mk text.l{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--card);stroke-width:3px}
.mapnote{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--ink-2);background:var(--card);padding:2px 6px;border-radius:3px}
.unloc{position:absolute;right:10px;top:10px;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.side{display:grid;gap:12px;align-content:start}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px 14px}
.panel h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:19px}
.mini{position:relative;height:30px;margin-top:6px}
.mini .base{position:absolute;left:0;right:0;top:12px;height:6px;background:var(--st-none);border-radius:3px}
.mini .rng{position:absolute;top:12px;height:6px;background:var(--accent);opacity:.35;border-radius:3px}
.mini .tk{position:absolute;top:8px;width:2px;height:14px;background:var(--accent)}
.mini .lb{position:absolute;top:22px;font-size:10px;color:var(--ink-2);translate:-50% 0;font-variant-numeric:tabular-nums}

/* S6 graph */
.graphbox{border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
.graphbox svg{display:block;width:100%;height:min(76vh,720px)}
.node{transition:transform .5s ease,opacity .3s}
.node .c{stroke:var(--card);stroke-width:2.5;cursor:pointer}
.node .c.tg{fill:var(--g-tg)} .node .c.ds{fill:var(--g-ds)} .node .c.ot{fill:var(--g-ot)}
.node .ch{fill:var(--paper);font-family:var(--f-display);font-size:18px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node .nm{fill:var(--ink);font-size:13px;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:4px;pointer-events:none}
.node .plus{cursor:pointer}
.node .plus circle{fill:var(--card);stroke:var(--ink-2)}
.node .plus text{fill:var(--ink);font-size:14px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.sel .c{stroke:var(--seal);stroke-width:3.5}
.node.dim,.edge.dim{opacity:.12}
.edge{transition:opacity .3s}
.edge line{stroke-width:2.2;transition:all .5s ease}
.e-結義{stroke:var(--r-jie)} .e-主僕{stroke:var(--r-zhu);stroke-dasharray:7 4} .e-兄弟{stroke:var(--r-xd);stroke-width:4!important}
.e-夫妻{stroke:var(--r-fq);stroke-dasharray:2 4;stroke-linecap:round} .e-仇敵{stroke:var(--r-ch);stroke-dasharray:10 4 2 4} .e-師徒{stroke:var(--ink-2)}
.glegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);padding:10px 14px;border-top:1px solid var(--line)}
.glegend svg{width:30px;height:10px;vertical-align:middle;margin-right:4px}
.gdot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="wrap mast">
  <div class="seal" aria-hidden="true"><span>水</span><span>滸</span><span>年</span><span>表</span></div>
  <div>
    <h1>水滸時間軸</h1>
    <p>依百二十回本《水滸全傳》章回 · 收錄 22 位人物、54 件事</p>
  </div>
</header>

<section class="filter" data-page="S1 角色篩選列">
  <div class="wrap">
    <div class="row">
      <label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="搜尋姓名或綽號，例如：黑旋風" autocomplete="off" aria-label="搜尋角色"></label>
      <button class="tog" id="tgTG" aria-pressed="false"><span class="dot" style="background:var(--g-tg)"></span>天罡</button>
      <button class="tog" id="tgDS" aria-pressed="false"><span class="dot" style="background:var(--g-ds)"></span>地煞</button>
      <select id="arcSel" aria-label="大節"></select>
    </div>
    <div class="chars" id="chars"></div>
    <div class="sel" id="sel"></div>
    <div class="bar">
      <div class="count" id="count" aria-live="polite"></div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-timeline" data-view="timeline">時間軸</button>
        <button role="tab" id="tab-map" data-view="map">地圖</button>
        <button role="tab" id="tab-graph" data-view="graph">關係圖</button>

const CH = Object.fromEntries(DATA.chapters.map(c => [c.no, c.title.replace(/^第\S+回\s*/, '')]));
const PL = Object.fromEntries(DATA.places.map(p => [p.id, p]));
const EVENTS = [...DATA.events].sort((a,b) => a.chapters[0]-b.chapters[0] || a.chapters[1]-b.chapters[1]);
const NUM = n => { const d='〇一二三四五六七八九'; if(n<=10) return n===10?'十':d[n]; const t=Math.floor(n/10),o=n%10; if(n<20) return '十'+(o?d[o]:''); if(n<100) return d[t]+'十'+(o?d[o]:''); const h=Math.floor(n/100),r=n%100; return d[h]+'百'+(r===0?'':(r<10?'零'+d[r]:(r<20?'一':'')+NUM(r))); };
const AVCH = {ruanxiaoer:'二', ruanxiaoqi:'七', yangzhi:'志', yangxiong:'雄'};
const grp = c => c.group==='天罡'?'tg':c.group==='地煞'?'ds':'ot';
const nick = c => c.nickname ? c.nickname.split('（')[0] : '';
const av = (c, cls='') => `<span class="av ${grp(c)} ${cls}" aria-hidden="true">${AVCH[c.id]||c.name[0]}</span>`;
const rng = e => e.chapters[0]===e.chapters[1] ? `第 ${e.chapters[0]} 回` : `第 ${e.chapters[0]}–${e.chapters[1]} 回`;

const S = { sel: new Set(), arc: '', q: '', view: 'timeline', focusPlace: null };
let lastOpenEvent = null;

/* ---------- filtering ---------- */
function filtered(){
  return EVENTS.filter(e => (!S.arc || e.arc===S.arc) && (S.sel.size===0 || e.characters.some(id => S.sel.has(id))));
}
function status(c, ch){
  if (c.fateChapter && ch >= c.fateChapter) return 'gone';
  if (c.joinChapter && ch >= c.joinChapter) return 'liang';
  if (ch >= c.firstChapter) return 'wild';
  return 'none';
}

/* ---------- S1 ---------- */
const arcSel = $('#arcSel');
arcSel.innerHTML = `<option value="">全部大節（第 1–120 回）</option>` + DATA.arcs.map(a => `<option value="${a.id}">${esc(a.name)}（第 ${a.chapters[0]}–${a.chapters[1]} 回）</option>`).join('');
arcSel.onchange = () => { S.arc = arcSel.value; render(); };
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); renderChars(); });
$('#q').addEventListener('keydown', e => { if (e.key==='Enter'){ const f = matchChars()[0]; if (f){ toggle(f.id); } } });
function matchChars(){
  const q = S.q; if (!q) return DATA.characters;
  return DATA.characters.filter(c => c.name.includes(q) || (c.nickname||'').includes(q));
}
function renderChars(){
  const list = matchChars();
  $('#chars').innerHTML = list.length ? list.map(c => `
    <div class="chip ${S.sel.has(c.id)?'on':''}">
      <button class="pick" data-pick="${c.id}" aria-pressed="${S.sel.has(c.id)}">${av(c)}<span class="nm">${esc(c.name)}</span>${nick(c)?`<span class="nk">${esc(nick(c))}</span>`:''}</button>
      <button class="info" data-info="${c.id}" aria-label="${esc(c.name)} 角色資料" title="角色資料">i</button>
    </div>`).join('') : `<div class="empty-note">找不到符合的角色</div>`;
}
$('#chars').addEventListener('click', e => {
  const p = e.target.closest('[data-pick]'); if (p) return toggle(p.dataset.pick);
  const i = e.target.closest('[data-info]'); if (i) openChar(i.dataset.info);
});
function toggle(id){ S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render(); }
function groupToggle(g){
  const ids = DATA.characters.filter(c => c.group===g).map(c => c.id);
  const all = ids.every(id => S.sel.has(id));
  ids.forEach(id => all ? S.sel.delete(id) : S.sel.add(id));
  render();
}
$('#tgTG').onclick = () => groupToggle('天罡');
$('#tgDS').onclick = () => groupToggle('地煞');
function renderSel(){
  const s = [...S.sel].map(id => C[id]);
  $('#sel').innerHTML = s.length
    ? `<span class="label">已選</span>` + s.map(c => `<span class="tag">${esc(c.name)}<button data-rm="${c.id}" aria-label="移除 ${esc(c.name)}">×</button></span>`).join('') + `<button class="link" id="clearAll">清除全部</button>`
    : `<span class="label">未選角色，顯示全部角色的事件</span>`;
  for (const g of [['天罡','#tgTG'],['地煞','#tgDS']]){
    const ids = DATA.characters.filter(c => c.group===g[0]).map(c => c.id);
    $(g[1]).setAttribute('aria-pressed', ids.every(id => S.sel.has(id)));
  }
}
$('#sel').addEventListener('click', e => {
  const r = e.target.closest('[data-rm]'); if (r){ S.sel.delete(r.dataset.rm); render(); }
  if (e.target.id==='clearAll'){ S.sel.clear(); render(); }
});
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
function setView(v){
  S.view = v;
  for (const k of ['timeline','map','graph']){ $('#v-'+k).hidden = k!==v; $('#tab-'+k).setAttribute('aria-selected', k===v); }
  try { history.replaceState(null,'','#'+v); } catch(e){}
  renderView();
}

/* ---------- S2 timeline ---------- */
const UNIT_MIN = 30, CARD_MIN = 170, LANE_H = 70, LANE_GAP = 8;
function evCard(e, style=''){
  const ids = [...e.characters].sort((a,b) => S.sel.has(b)-S.sel.has(a));
  const shown = ids.slice(0,3), more = ids.length-3;
  const single = e.chapters[0]===e.chapters[1];
  return `<button class="ev" data-ev="${e.id}" style="${style}">
    <i class="span ${single?'pt':''}" style="${single?'':'width:var(--sw)'}"></i>
    <span class="t">${esc(e.title)}</span>
    <span class="m">${rng(e)}<span class="avs">${shown.map(id => av(C[id], S.sel.has(id)?'ring':'')).join('')}</span>${more>0?`<span class="more">+${more}</span>`:''}${ids.length===0?'<span class="more">（無收錄角色）</span>':''}</span>
  </button>`;
}
function emptyHTML(){ return `<div class="empty"><h3>沒有符合條件的事件</h3><p>目前的角色與大節組合下沒有事件。</p><button class="primary" data-clear>清除篩選</button></div>`; }
function renderTimeline(){
  const evs = filtered();
  const [c0, c1] = S.arc ? ARC[S.arc].chapters : [1,120];
  const span = c1 - c0 + 1;
  const avail = $('#tlScroll').clientWidth || 1000;
  const unit = Math.max(UNIT_MIN, Math.floor(avail / span));
  const W = span * unit;
  const x = ch => (ch - c0) * unit;
  const arcs = DATA.arcs.filter(a => a.chapters[1] >= c0 && a.chapters[0] <= c1);
  let html = `<div class="arcs" style="width:${W}px">` + arcs.map(a => {
    const l = x(Math.max(a.chapters[0],c0)), w = (Math.min(a.chapters[1],c1)-Math.max(a.chapters[0],c0)+1)*unit;
    return `<button class="arc" data-arc="${a.id}" style="left:${l}px;width:${w}px" title="${esc(a.name)}"><b>${esc(a.name)}</b><span>${a.chapters[0]}–${a.chapters[1]}</span></button>`;
  }).join('') + `</div><div class="ruler" style="width:${W}px">`;
  for (let ch = c0; ch <= c1; ch++){
    if (ch===c0 || ch%10===0) html += `<span class="tick" style="left:${x(ch)}px">${ch}</span>`;
    else if (unit >= 60 || ch%5===0) html += `<span class="tick minor" style="left:${x(ch)}px"></span>`;
  }
  html += `</div>`;
  if (!evs.length){ $('#tl').innerHTML = html + emptyHTML(); $('#tl').style.width = W+'px'; }
  else {
    const laneEnd = [];
    const placed = evs.map(e => {
      const l = x(e.chapters[0]) + 4, sw = (e.chapters[1]-e.chapters[0]+1)*unit - 8;
      const w = Math.max(CARD_MIN, sw);
      let lane = laneEnd.findIndex(end => end <= l);
      if (lane < 0){ lane = laneEnd.length; laneEnd.push(0); }
      laneEnd[lane] = l + w + 6;
      return {e, l, w, sw, lane};
    });
    const H = laneEnd.length * (LANE_H + LANE_GAP) + 16;
    html += `<div class="lanes" style="width:${W}px;height:${H}px">` + placed.map(p =>
      evCard(p.e, `left:${p.l}px;top:${8 + p.lane*(LANE_H+LANE_GAP)}px;width:${p.w}px;height:${LANE_H}px;--sw:${p.sw}px`)).join('') + `</div>`;
    $('#tl').innerHTML = html; $('#tl').style.width = W+'px';
  }
  // vertical (phone)
  const groups = DATA.arcs.map(a => ({a, list: evs.filter(e => e.arc===a.id)})).filter(g => g.list.length);
  $('#vlist').innerHTML = evs.length ? groups.map(g => `<div class="vgroup"><h3><button data-arc="${g.a.id}">${esc(g.a.name)}</button><small>第 ${g.a.chapters[0]}–${g.a.chapters[1]} 回</small></h3>
    <div class="stack">${g.list.map(e => `<div class="vrow"><div class="ch">${e.chapters[0]}${e.chapters[1]!==e.chapters[0]?'–'+e.chapters[1]:''}</div>${evCard(e)}</div>`).join('')}</div></div>`).join('') : emptyHTML();
}
document.addEventListener('click', e => {
  const ev = e.target.closest('[data-ev]'); if (ev) return openEvent(ev.dataset.ev);
  const ar = e.target.closest('[data-arc]'); if (ar){ S.arc = ar.dataset.arc; arcSel.value = S.arc; render(); $('#tlScroll').scrollLeft = 0; return; }
  if (e.target.closest('[data-clear]')){ S.sel.clear(); S.arc=''; arcSel.value=''; render(); }
});

/* ---------- drawers S3 / S4 ---------- */
function showDrawer(id){
  $('#scrim').hidden = false;
  $('#dEvent').hidden = id!=='dEvent'; $('#dChar').hidden = id!=='dChar';
}
function closeDrawers(){ $('#scrim').hidden = true; $('#dEvent').hidden = true; $('#dChar').hidden = true; }
$('#scrim').onclick = closeDrawers;
document.addEventListener('keydown', e => { if (e.key==='Escape') closeDrawers(); });

function openEvent(id){
  const e = DATA.events.find(x => x.id===id); lastOpenEvent = id;
  const f = filtered(); const list = f.some(x => x.id===id) ? f : EVENTS;
  const i = list.findIndex(x => x.id===id), prev = list[i-1], next = list[i+1];
  const chs = []; for (let n=e.chapters[0]; n<=e.chapters[1]; n++) chs.push(n);
  const d = $('#dEvent');
  d.innerHTML = `<div class="dh"><span class="k">事件 · ${esc(ARC[e.arc].name)}</span><button class="x" data-close aria-label="關閉">×</button></div>
  <div class="db">
    <div><h2>${esc(e.title)}</h2>
      <div class="meta" style="margin-top:6px"><span><b>${rng(e)}</b></span><span>大節 <b>${esc(ARC[e.arc].name)}</b></span></div></div>
    <p class="summary">${esc(e.summary)}</p>
    <div class="sec"><h4>回目</h4><ul class="huimu">${chs.map(n => `<li><span>第${NUM(n)}回</span>${esc(CH[n])}</li>`).join('')}</ul></div>
    <div class="sec"><h4>地點</h4>${e.place ? `<button class="place" data-goplace="${esc(e.place)}">${esc(e.location)} · 在地圖上看</button>` : `<span class="badge">${esc(e.location)}（無法在示意地圖上定位）</span>`}</div>
    <div class="sec"><h4>參與角色</h4>${e.characters.length ? `<div class="people">${e.characters.map(cid => { const c=C[cid]; return `<div class="person"><button class="av ${grp(c)} ${S.sel.has(cid)?'ring':''}" data-add="${cid}" title="加入篩選" aria-label="將 ${esc(c.name)} 加入篩選">${AVCH[cid]||c.name[0]}</button><button class="nmb" data-char="${cid}">${esc(c.name)}</button><small>${esc(nick(c))}</small>${S.sel.has(cid)?'<span class="added">已在篩選中</span>':''}</div>`; }).join('')}</div><p class="hint">點頭像加入篩選，點名字看角色資料。</p>` : `<p class="hint">本事件沒有收錄名單中的角色。</p>`}</div>
  </div>
  <div class="pn"><button data-ev="${prev?prev.id:''}" ${prev?'':'disabled'}>← ${prev?esc(prev.title):'已是第一個'}</button><button data-ev="${next?next.id:''}" ${next?'':'disabled'}>${next?esc(next.title):'已是最後一個'} →</button></div>`;
  showDrawer('dEvent');
}
function openChar(id){
  const c = C[id];
  const evs = EVENTS.filter(e => e.characters.includes(id));
  const rels = DATA.relations.filter(r => r.a===id || r.b===id).map(r => ({o: C[r.a===id?r.b:r.a], t: r.type, note: r.note}));
  let segs = [], cur = null;
  for (let n=1; n<=120; n++){ const s = status(c,n); if (cur && cur.s===s) cur.n++; else segs.push(cur={s, n:1}); }
  const mk = [['登場',c.firstChapter],['上梁山',c.joinChapter],['結局',c.fateChapter]].filter(m => m[1]);
  const pos = n => ((n-1)/120*100).toFixed(2)+'%';
  const d = $('#dChar');
  d.innerHTML = `<div class="dh"><span class="k">角色資料</span><button class="x" data-close aria-label="關閉">×</button></div>
  <div class="db">
    <div style="display:flex;gap:14px;align-items:center">${av(c).replace('class="av','style="width:56px;height:56px;font-size:28px" class="av')}
      <div><h2>${esc(c.name)}</h2><div class="meta">${nick(c)?`<span>綽號 <b>${esc(c.nickname)}</b></span>`:''}<span>${c.star?`<b>${esc(c.star)}</b>・第 ${c.rank} 位・${c.group}`:'<b>非一百單八將</b>'}</span></div></div></div>
    <div class="sec"><h4>一百二十回中的狀態</h4>
      <div class="stwrap">${mk.map((m,i) => { const prev = mk[i-1]; const up = prev && Math.abs(m[1]-prev[1]) < 16 && i%2===1; const L = pos(m[1]+.5); const tr = m[1] > 108 ? 'translate:-100% 0;' : m[1] < 8 ? 'translate:0 0;' : ''; return `<span class="stmk" style="left:${L};top:${up?0:15}px;${tr}">${m[0]} ${m[1]}</span><span class="stln" style="left:${L};${up?'top:14px;height:44px':''}"></span>`; }).join('')}
        <div class="stbar" role="img" aria-label="${segs.map(s => ({none:'未登場',wild:'在野',liang:'已上梁山',gone:'已死亡或離散'})[s.s]+' '+s.n+' 回').join('，')}">${segs.map(s => `<i class="s-${s.s}" style="width:${s.n/120*100}%"></i>`).join('')}</div>
        <div class="stscale"><span>1</span><span>30</span><span>60</span><span>90</span><span>120</span></div></div>
      <div class="legend" style="margin-top:8px"><span><i class="s-none"></i>未登場</span><span><i class="s-wild"></i>在野</span><span><i class="s-liang"></i>已上梁山</span><span><i class="s-gone"></i>已死亡或離散</span></div></div>
    <div class="sec"><h4>結局</h4><p class="summary" style="font-size:14px">${esc(c.fate)}${c.fateChapter?`（第 ${c.fateChapter} 回）`:''}</p></div>
    <button class="primary" data-only="${id}">只看此角色</button>
    <div class="sec"><h4>參與事件（${evs.length}）</h4><ul class="elist">${evs.map(e => `<li><button data-ev="${e.id}"><span>${rng(e).replace('第 ','').replace(' 回','回')}</span><b>${esc(e.title)}</b></button></li>`).join('')}</ul></div>
    <div class="sec"><h4>人物關係</h4>${rels.length ? `<div class="rlist">${rels.map(r => `<button data-char="${r.o.id}" title="${esc(r.note)}">${av(r.o)}${esc(r.o.name)}<span class="rt" style="color:var(--r-${({結義:'jie',主僕:'zhu',兄弟:'xd',夫妻:'fq',仇敵:'ch'})[r.t]||'jie'})">${r.t}</span></button>`).join('')}</div>` : '<p class="hint">收錄範圍內沒有此角色的關係資料。</p>'}</div>
  </div>`;
  showDrawer('dChar');
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return closeDrawers();
  const a = e.target.closest('[data-add]'); if (a){ S.sel.add(a.dataset.add); render(); if (lastOpenEvent) openEvent(lastOpenEvent); return; }
  const ch = e.target.closest('[data-char]'); if (ch) return openChar(ch.dataset.char);
  const o = e.target.closest('[data-only]'); if (o){ S.sel = new Set([o.dataset.only]); closeDrawers(); render(); return; }
  const gp = e.target.closest('[data-goplace]'); if (gp){ S.focusPlace = gp.dataset.goplace; closeDrawers(); setView('map'); return; }
  const pl = e.target.closest('[data-place]'); if (pl){ S.focusPlace = pl.dataset.place; renderMap(); return; }
});

/* ---------- S5 map ---------- */
const MW = 860, MH = 700, LON0 = 105, LON1 = 122.5, LAT0 = 27, LAT1 = 41.5;
const px = (lon, lat) => [ (lon-LON0)/(LON1-LON0)*MW, (LAT1-lat)/(LAT1-LAT0)*MH ];
const pts = a => a.map(p => px(p[0],p[1]).map(v => v.toFixed(1)).join(',')).join(' ');
const SEA = [[123.5,41.5],[121.4,40.9],[120.4,40.2],[119.4,39.8],[118.3,39.1],[117.7,38.7],[118.3,38.0],[119.0,37.2],[120.0,37.5],[120.7,37.8],[121.6,37.5],[122.5,37.3],[122.4,36.9],[121.0,36.6],[120.2,35.9],[119.4,35.1],[120.3,34.3],[120.8,33.2],[121.0,32.4],[121.9,31.7],[121.9,30.9],[121.1,30.4],[122.0,29.9],[121.6,28.8],[121.1,27.9],[120.7,27.0],[123.5,27.0]];
const LIAODONG = [[123.5,41.5],[122.3,40.8],[121.6,39.6],[121.2,38.8],[122.1,39.2],[123.5,39.9]];
const HUANGHE = [[105,36.6],[106.4,38.5],[107.6,40.3],[109.8,40.6],[111.2,40.0],[110.6,37.6],[110.3,35.4],[111.6,34.8],[113.4,34.9],[114.6,35.1],[115.5,36.3],[116.4,37.5],[117.3,38.6],[117.7,38.95]];
const CHANGJIANG = [[105,29.4],[106.6,29.6],[108.4,30.8],[110.4,31.0],[111.4,30.6],[112.5,29.8],[113.4,29.8],[114.3,30.6],[115.6,29.8],[116.4,29.8],[117.5,30.7],[118.4,31.4],[118.9,32.1],[119.9,32.2],[120.9,31.9],[121.8,31.5]];
function renderMap(){
  const evs = filtered();
  const located = evs.filter(e => e.place), unloc = evs.length - located.length;
  const byPlace = {}; located.forEach(e => (byPlace[e.place] ??= []).push(e));
  const single = S.sel.size===1 ? [...S.sel][0] : null;
  let trail = '';
  if (single){
    const seq = []; located.filter(e => e.characters.includes(single)).forEach(e => { if (seq[seq.length-1]!==e.place) seq.push(e.place); });
    const P = seq.map(p => px(PL[p].lon, PL[p].lat));
    if (P.length > 1){
      trail = `<polyline class="trail" points="${P.map(p => p.join(',')).join(' ')}"/>` +
        P.slice(0,-1).map((p,i) => { const q=P[i+1], mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2; return `<circle cx="${mx}" cy="${my}" r="8" fill="var(--seal)"/><text class="trailno" x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="central">${i+1}</text>`; }).join('');
    }
  }
  const [lmx, lmy] = px(116.1, 35.8);
  const [hx, hy] = px(111.0, 40.4), [cx2, cy2] = px(109.4, 31.25);
  const marks = Object.entries(byPlace).map(([pid, list]) => {
    const [x,y] = px(PL[pid].lon, PL[pid].lat); const r = 9 + Math.min(list.length,8)*1.3;
    const lx = x > MW-90 ? x - r - 4 : x + r + 4, anchor = x > MW-90 ? 'end' : 'start';
    return `<g class="mk ${S.focusPlace===pid?'hi':''}" data-place="${esc(pid)}" tabindex="0" role="button" aria-label="${esc(pid)}，${list.length} 個事件"><circle class="o" cx="${x}" cy="${y}" r="${r}"/><text class="n" x="${x}" y="${y}">${list.length}</text><text class="l" x="${lx}" y="${y+4}" text-anchor="${anchor}">${esc(pid)}</text></g>`;
  }).join('');
  $('#mapbox').innerHTML = `<svg viewBox="0 0 ${MW} ${MH}" role="img" aria-label="北宋疆域示意地圖">
    <rect class="land" width="${MW}" height="${MH}"/>
    <polygon class="sea" points="${pts(SEA)}"/><polygon class="land" points="${pts(LIAODONG)}"/>
    <polyline class="river" points="${pts(HUANGHE)}"/><polyline class="river" points="${pts(CHANGJIANG)}"/>
    <text class="rlabel" x="${hx}" y="${hy-8}">黃河（北宋河道示意）</text><text class="rlabel" x="${cx2}" y="${cy2-8}">長江</text>
    <ellipse class="marsh" cx="${lmx}" cy="${lmy}" rx="22" ry="13"/>
    <text class="rlabel" x="${px(121,33.8)[0]}" y="${px(121,33.8)[1]}" style="font-size:14px;letter-spacing:.3em">東海</text>
    ${trail}${marks}</svg>
    <span class="mapnote">示意，非精確測繪</span>${unloc>0?`<span class="unloc">${unloc} 個事件無法標示地點</span>`:''}${evs.length===0?`<div style="position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 80%,transparent)">${emptyHTML()}</div>`:''}`;
  // side
  const fp = S.focusPlace && byPlace[S.focusPlace] ? S.focusPlace : null;
  const [c0,c1] = S.arc ? ARC[S.arc].chapters : [1,120];
  const P = n => ((n-1)/119*100).toFixed(2)+'%';
  $('#mapside').innerHTML = `
    ${fp ? `<div class="panel"><h3>${esc(fp)}</h3><p class="hint" style="margin:0 0 6px">${byPlace[fp].length} 個事件</p><ul class="elist">${byPlace[fp].map(e => `<li><button data-ev="${e.id}"><span>${e.chapters[0]}${e.chapters[1]!==e.chapters[0]?'–'+e.chapters[1]:''}回</span><b>${esc(e.title)}</b></button></li>`).join('')}</ul></div>`
         : `<div class="panel"><h3>地點</h3><p class="hint" style="margin:0">點地圖上的標記，列出在該地發生的事件。${S.focusPlace && !byPlace[S.focusPlace] ? `<br>「${esc(S.focusPlace)}」不在目前的篩選結果中。` : ''}</p></div>`}
    <div class="panel"><h3>${single ? esc(C[single].name)+'的行跡' : '目前篩選'}</h3>
      <p class="hint" style="margin:0">${single ? '紅色虛線依章回順序連接地點，數字為移動順序。' : S.sel.size>1 ? '選了多位角色時只標出地點，不畫行跡線。只選一位角色可看行跡。' : '只選一位角色時，會以虛線畫出他的行跡。'}</p>
      <div class="mini" aria-label="章回範圍"><div class="base"></div><div class="rng" style="left:${P(c0)};width:calc(${P(c1)} - ${P(c0)})"></div>
        ${evs.map(e => `<div class="tk" style="left:${P(e.chapters[0])}"></div>`).join('')}
        <span class="lb" style="left:0;translate:0 0">1</span><span class="lb" style="left:50%">60</span><span class="lb" style="left:100%;translate:-100% 0">120</span></div>
      <p class="hint" style="margin:6px 0 0">${S.arc ? esc(ARC[S.arc].name)+'，' : ''}第 ${c0}–${c1} 回，共 ${evs.length} 個事件</p></div>`;
}
$('#mapbox').addEventListener('keydown', e => { const m = e.target.closest('[data-place]'); if (m && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); S.focusPlace = m.dataset.place; renderMap(); } });

/* ---------- S6 graph ---------- */
const GW = 820, GH = 720, GCX = GW/2, GCY = GH/2;
const NB = {}; DATA.relations.forEach(r => { (NB[r.a] ??= new Set()).add(r.b); (NB[r.b] ??= new Set()).add(r.a); });
const RING_ORDER = ['gaoqiu','yangzhi','luzhishen','linchong','chaijin','wusong','likui','daizong','huarong','wangying','husanniang','shiqian','yangxiong','shixiu','yanqing','lujunyi','ruanxiaoqi','ruanxiaoer','gongsunsheng','wuyong','chaogai','songjiang'];
function layout(){
  const center = S.sel.size ? [...S.sel] : ['songjiang'];
  const cset = new Set(center);
  const ring1 = RING_ORDER.filter(id => !cset.has(id) && center.some(c => NB[c]?.has(id)));
  const ring2 = RING_ORDER.filter(id => !cset.has(id) && !ring1.includes(id));
  const pos = {};
  const place = (ids, r, off=-Math.PI/2) => ids.forEach((id,i) => { const a = off + i/ids.length*Math.PI*2; pos[id] = [GCX + r*Math.cos(a), GCY + r*Math.sin(a)]; });
  if (center.length===1) pos[center[0]] = [GCX,GCY]; else place(center, Math.min(40+center.length*12, 130));
  const r1 = center.length>1 ? 220 : 175;
  place(ring1, r1, -Math.PI/2 + .2);
  place(ring2, 315, -Math.PI/2);
  return {pos, cset, ring1:new Set(ring1)};
}
function renderGraph(){
  const {pos, cset, ring1} = layout();
  const focus = S.sel.size > 0;
  const vis = id => !focus || cset.has(id) || ring1.has(id);
  let g = $('#graph svg');
  if (!g){
    $('#graph').innerHTML = `<svg viewBox="0 0 ${GW} ${GH}" role="img" aria-label="角色關係圖"><g id="edges"></g><g id="nodes"></g></svg>`;
    $('#edges').innerHTML = DATA.relations.map((r,i) => `<g class="edge" data-i="${i}"><line class="e-${r.type}"><title>${esc(C[r.a].name)}—${esc(C[r.b].name)}：${r.type}。${esc(r.note)}</title></line></g>`).join('');
    $('#nodes').innerHTML = DATA.characters.map(c => `<g class="node" data-node="${c.id}" style="transform:translate(${GCX}px,${GCY}px)">
      <circle class="c ${grp(c)}" r="22" data-char="${c.id}" tabindex="0" role="button" aria-label="${esc(c.name)} 角色資料"><title>${esc(c.name)}</title></circle>
      <text class="ch">${AVCH[c.id]||c.name[0]}</text><text class="nm" y="38">${esc(c.name)}</text>
      <g class="plus" data-gadd="${c.id}" transform="translate(19,-19)" role="button" aria-label="將 ${esc(c.name)} 加入篩選"><circle r="9"/><text>＋</text></g></g>`).join('');
    const types = [...new Set(DATA.relations.map(r => r.type))];
    $('#glegend').innerHTML = `<span><span class="gdot" style="background:var(--g-tg)"></span>天罡</span><span><span class="gdot" style="background:var(--g-ds)"></span>地煞</span><span><span class="gdot" style="background:var(--g-ot)"></span>其他</span>` +
      types.map(t => `<span><svg viewBox="0 0 30 10"><line class="e-${t}" x1="0" y1="5" x2="30" y2="5" stroke-width="2.2"/></svg>${t}</span>`).join('') +
      `<span>點人物看資料，點「＋」加入篩選${focus?'':'；未選角色時以宋江為中心'}</span>`;
    g = $('#graph svg'); g.getBoundingClientRect();
  }
  DATA.characters.forEach(c => {
    const n = g.querySelector(`[data-node="${c.id}"]`), [x,y] = pos[c.id];
    n.style.transform = `translate(${x}px,${y}px)`;
    n.classList.toggle('sel', S.sel.has(c.id)); n.classList.toggle('dim', !vis(c.id));
    n.querySelector('.plus').style.display = S.sel.has(c.id) ? 'none' : '';
  });
  DATA.relations.forEach((r,i) => {
    const e = g.querySelector(`.edge[data-i="${i}"]`), l = e.firstElementChild;
    const [x1,y1] = pos[r.a], [x2,y2] = pos[r.b];
    l.setAttribute('x1',x1); l.setAttribute('y1',y1); l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    e.classList.toggle('dim', focus && !(cset.has(r.a) || cset.has(r.b)));
  });
}
$('#graph').addEventListener('click', e => { const p = e.target.closest('[data-gadd]'); if (p){ e.stopPropagation(); S.sel.add(p.dataset.gadd); render(); } }, true);
$('#graph').addEventListener('keydown', e => { const c = e.target.closest('[data-char]'); if (c && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); openChar(c.dataset.char); } });

/* ---------- render ---------- */
function renderView(){ if (S.view==='timeline') renderTimeline(); else if (S.view==='map') renderMap(); else renderGraph(); }
function render(){
  renderChars(); renderSel();
  $('#count').innerHTML = `共<b>${filtered().length}</b>個事件`;
  renderView();
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => S.view==='timeline' && renderTimeline(), 150); });
const h = (location.hash||'').slice(1);
setView(['timeline','map','graph'].includes(h) ? h : 'timeline');
render();
})();
</script>
